name: Quality Gates

on:
  push:
    branches:
      - 'validation/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
      - validation/final-integration-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Expo and Android quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        id: setup_android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages for Expo SDK 58
        id: android_sdk_packages
        continue-on-error: true
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

          # API 37 is published under android-37.0; expose the integer alias
          # used by Gradle's compileSdk 37 lookup.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install locked npm dependencies
        id: npm_ci
        continue-on-error: true
        run: npm ci

      - name: TypeScript check
        id: typecheck
        if: ${{ steps.npm_ci.outcome == 'success' }}
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Expo Doctor
        id: expo_doctor
        if: ${{ steps.npm_ci.outcome == 'success' }}
        continue-on-error: true
        run: npx expo-doctor

      - name: Validate public Expo configuration
        id: expo_config
        if: ${{ steps.npm_ci.outcome == 'success' }}
        continue-on-error: true
        run: npx expo config --type public

      - name: Generate Android native project
        id: android_prebuild
        if: ${{ steps.npm_ci.outcome == 'success' }}
        continue-on-error: true
        run: npx expo prebuild --platform android --no-install

      # This step is mandatory whenever prebuild succeeds. Do not use
      # hashFiles() to silently skip a missing Gradle wrapper.
      - name: Build Android debug APK
        id: android_build
        if: ${{ steps.android_prebuild.outcome == 'success' }}
        continue-on-error: true
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Android prebuild succeeded but android/gradlew is missing."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish quality gate summary
        id: quality_summary
        if: always()
        shell: bash
        env:
          NODE_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
          JAVA_SETUP_OUTCOME: ${{ steps.setup_java.outcome }}
          ANDROID_SETUP_OUTCOME: ${{ steps.setup_android.outcome }}
          ANDROID_SDK_OUTCOME: ${{ steps.android_sdk_packages.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm_ci.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          EXPO_DOCTOR_OUTCOME: ${{ steps.expo_doctor.outcome }}
          EXPO_CONFIG_OUTCOME: ${{ steps.expo_config.outcome }}
          ANDROID_PREBUILD_OUTCOME: ${{ steps.android_prebuild.outcome }}
          ANDROID_BUILD_OUTCOME: ${{ steps.android_build.outcome }}
        run: |
          {
            echo "## Quality gate results"
            echo
            echo "| Required check | Actual outcome |"
            echo "| --- | --- |"
            echo "| Node.js 22 setup | $NODE_SETUP_OUTCOME |"
            echo "| Java 21 setup | $JAVA_SETUP_OUTCOME |"
            echo "| Android SDK setup | $ANDROID_SETUP_OUTCOME |"
            echo "| Android SDK packages (API 37 / Build Tools 37.0.0 / NDK 27.1.12297006) | $ANDROID_SDK_OUTCOME |"
            echo "| npm ci | $NPM_CI_OUTCOME |"
            echo "| TypeScript (npx tsc --noEmit) | $TYPECHECK_OUTCOME |"
            echo "| Expo Doctor | $EXPO_DOCTOR_OUTCOME |"
            echo "| Public Expo config | $EXPO_CONFIG_OUTCOME |"
            echo "| Android prebuild | $ANDROID_PREBUILD_OUTCOME |"
            echo "| Android debug build (:app:assembleDebug) | $ANDROID_BUILD_OUTCOME |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Read .outcome, not .conclusion: continue-on-error can change a
          # failed step's conclusion to success while its real outcome stays failure.
          failed=0
          require_success() {
            local check_name="$1"
            local actual_outcome="$2"
            if [ "$actual_outcome" != "success" ]; then
              echo "::error::Required check '$check_name' outcome is '$actual_outcome'; expected 'success'."
              failed=1
            fi
          }

          require_success "Node.js 22 setup" "$NODE_SETUP_OUTCOME"
          require_success "Java 21 setup" "$JAVA_SETUP_OUTCOME"
          require_success "Android SDK setup" "$ANDROID_SETUP_OUTCOME"
          require_success "Android SDK package installation" "$ANDROID_SDK_OUTCOME"
          require_success "npm ci" "$NPM_CI_OUTCOME"
          require_success "TypeScript" "$TYPECHECK_OUTCOME"
          require_success "Expo Doctor" "$EXPO_DOCTOR_OUTCOME"
          require_success "Public Expo config" "$EXPO_CONFIG_OUTCOME"
          require_success "Android prebuild" "$ANDROID_PREBUILD_OUTCOME"
          require_success "Android debug build" "$ANDROID_BUILD_OUTCOME"

          if [ "$failed" -eq 0 ]; then
            echo "**Overall quality gate: PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Overall quality gate: FAIL**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
