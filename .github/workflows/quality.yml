name: Quality Gates

on:
  push:
    branches:
      - 'validation/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Expo and Android quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages for Expo SDK 58
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

          # API 37 is published under android-37.0; expose the integer alias
          # used by Gradle's compileSdk 37 lookup.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install locked npm dependencies
        run: npm ci

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Expo Doctor
        id: expo_doctor
        continue-on-error: true
        run: npx expo-doctor

      - name: Validate public Expo configuration
        id: expo_config
        continue-on-error: true
        run: npx expo config --type public

      - name: Generate Android native project
        id: android_prebuild
        continue-on-error: true
        run: npx expo prebuild --platform android --no-install

      - name: Build Android debug APK
        id: android_build
        if: ${{ steps.android_prebuild.outcome == 'success' && hashFiles('android/gradlew') != '' }}
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish quality gate summary
        if: always()
        shell: bash
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          EXPO_DOCTOR_OUTCOME: ${{ steps.expo_doctor.outcome }}
          EXPO_CONFIG_OUTCOME: ${{ steps.expo_config.outcome }}
          ANDROID_PREBUILD_OUTCOME: ${{ steps.android_prebuild.outcome }}
          ANDROID_BUILD_OUTCOME: ${{ steps.android_build.outcome }}
        run: |
          {
            echo "## Quality gate results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| TypeScript (npx tsc --noEmit) | $TYPECHECK_OUTCOME |"
            echo "| Expo Doctor | $EXPO_DOCTOR_OUTCOME |"
            echo "| Public Expo config | $EXPO_CONFIG_OUTCOME |"
            echo "| Android prebuild | $ANDROID_PREBUILD_OUTCOME |"
            echo "| Android debug build | $ANDROID_BUILD_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in \
            "$TYPECHECK_OUTCOME" \
            "$EXPO_DOCTOR_OUTCOME" \
            "$EXPO_CONFIG_OUTCOME" \
            "$ANDROID_PREBUILD_OUTCOME" \
            "$ANDROID_BUILD_OUTCOME"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more quality checks failed. See the step logs and summary."
            exit 1
          fi
